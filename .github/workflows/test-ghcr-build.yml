name: Stage GHCR Image Builds

on:
  pull_request:
  push:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: hy3ons

jobs:
  build:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: kite-api
            image: kite-api
            context: ./kite
            dockerfile: ./kite/Dockerfile.api
          - component: kite-controller
            image: kite-controller
            context: ./kite
            dockerfile: ./kite/Dockerfile.controller
          - component: kite-gateway
            image: kite-gateway
            context: ./kite
            dockerfile: ./kite/Dockerfile.gateway
          - component: kite-frontend
            image: kite-frontend
            context: ./kite-frontend
            dockerfile: ./kite-frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR for stage publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/stage' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_KITE_MODE=production
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            NEXT_PUBLIC_USE_MOCK=false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:stage
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:stage-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=stage
